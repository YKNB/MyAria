name: DevSecOps Security Scan

# Déclencheurs : exécuter le scan sur la branche principale et lors des PR
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    name: Run Security Scans
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source du dépôt
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Trufflehog a besoin de tout l'historique pour scanner les commits passés

      # Étape 2 : Scan des Secrets (TruffleHog)
      # Cet outil cherche les clés API, mots de passe ou tokens cachés dans votre historique Git
      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
         # base: ${{ github.event.repository.default_branch }}
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
         # head: HEAD
          extra_args: --debug --only-verified # --only-verified tente de valider la clé auprès du fournisseur (ex: AWS) pour éviter les faux positifs

      # Étape 3 : Scan des Dépendances et Vulnérabilités (Trivy)
      # Cet outil cherche les failles connues dans vos packages (package.json, requirements.txt, etc.)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs' # 'fs' signifie qu'on scanne le système de fichiers du projet
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Fait échouer le pipeline (statut rouge) si une vulnérabilité est trouvée
          severity: 'CRITICAL,HIGH' # On ne bloque le pipeline que pour les failles critiques ou élevées