apiVersion: apps/v1
kind: Deployment
metadata:
  name: myaria-app
  labels:
    app: myaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myaria
  template:
    metadata:
      labels:
        app: myaria
    spec:
      # Ligne Sec : Permet à K3s de se connecter à ton Docker Hub privé
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: myaria-container
        image: YKNB/myaria-app:latest # Remplace par TON_USER_DOCKERHUB/myaria-app:latest si besoin
        imagePullPolicy: Always # Force le pull depuis Internet
        ports:
        - containerPort: 80
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: myaria-service
spec:
  type: ClusterIP
  selector:
    app: myaria
  ports:
  - port: 80
    targetPort: 80